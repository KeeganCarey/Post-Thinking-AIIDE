[project]
name = "Training"
version = "0.1.0"
description = "training the models on v6e-8 TPUs"
readme = "README.md"
requires-python = "~=3.13.0"
dependencies = [
    "datasets>=5.0.0",
    "flax",
    "google-cloud-storage>=3.11.0",
    "google-tunix[prod]",
    "grain>=0.2.17",
    "jax",
    "numpy>2",
    "qwix",
    "safetensors",
    "tensorflow>=2.21.0",
    "tensorflow-datasets>=4.9.10",
    "torch>=2.12.0",
    "transformers",
    "wandb>=0.27.2",
]

[tool.uv.sources]
jax = { git = "https://github.com/jax-ml/jax" }
qwix = { git = "https://github.com/google/qwix" }
flax = { git = "https://github.com/google/flax" }
google-tunix = { git = "https://github.com/google/tunix" }
