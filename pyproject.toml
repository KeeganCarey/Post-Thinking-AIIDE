[project]
name = "Post-Thinking-AIIDE"
version = "0.1.0"
description = "Post thinking for better character consistency for NPC roleplaying"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=3.0.0",
    "fastapi>=0.118.0",
    "huggingface>=0.0.1",
    "huggingface-hub>=0.25.0",
    "httpx>=0.28.0",
    "lmstudio>=1.5.0",
    "openai>=2.26.0",
    "protobuf>=7.34.0",
    "python-dotenv>=1.2.2",
    "transformers>=5.3.0",
    "matplotlib>=3.9.0",
    "tiktoken>=0.7.0",
    "nltk>=3.9.0",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "scipy>=1.17.1",
    "tqdm>=4.67.3",
    "pynvml>=13.0.1",
    "uvicorn[standard]>=0.38.0",
    "wandb>=0.27.2",
]

[project.optional-dependencies]
eval-gpu = [
    "sentence-transformers>=5.5.1",
    "torch>=2.12.0",
]
